name: gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Runtime
        run: node --version

      # One step, because there is one gate. Bare `node --test` discovers every
      # *.test.mjs: a test that exists is a test that runs — including WN-01,
      # which packs the release, installs it into a prefix with a space and CJK
      # in it, and calls the binary from every shell the platform provides.
      #
      # That check used to live here, as four YAML steps. It never ran once —
      # this branch has no CI history — and its Windows half was written in
      # POSIX syntax that could not have passed under the runner's default
      # shell. An assertion only CI can run is an assertion nobody can probe;
      # in the gate it goes red on a developer's machine before reaching here.
      - name: Gate
        run: npm test
