name: gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Runtime
        run: node --version
      # Bare `node --test` discovers every *.test.mjs: a test that exists is a
      # test that runs. Today that is the spec-integrity check; slice 1 adds
      # the log kernel.
      - name: Gate
        run: npm test
