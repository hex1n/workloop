name: gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Runtime
        run: node --version
      # Bare `node --test` discovers every *.test.mjs: a test that exists is a
      # test that runs. Today that is the spec-integrity check; slice 1 adds
      # the log kernel.
      - name: Gate
        run: npm test

      # HF-06 / WN-01, without an installer: the distribution is an npm package
      # with a bin, so what needs proving is that the packaged thing works once
      # installed — on every platform, from the shell that platform gives you.
      # A tarball that only runs from its source tree is not a release.
      - name: Packaged binary runs where it is installed
        run: |
          npm pack --silent
          npm install --no-save --global ./workloop-0.0.0.tgz
          workloop --help
          workloop frobnicate || test $? -eq 1
